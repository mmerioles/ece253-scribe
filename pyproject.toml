[project]
name = "scribe-baseline"
version = "0.1.0"
description = "A minimal line-by-line TrOCR baseline for handwritten notes"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.57,<5",
    "pillow>=11,<13",
    "jiwer>=4,<5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
